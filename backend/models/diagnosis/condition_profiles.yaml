# Centralized clinical knowledge profiles for the diagnosis engine.
# This file separates clinical data from Python logic.

# commonness: A categorical representation of prevalence.
#   - common: >5%
#   - uncommon: 1-5%
#   - rare: 0.1-1%
#   - very_rare: <0.1%
# required_features: A set of symptoms, one of which MUST be present for the
#   condition to be seriously considered. Absence leads to a heavy penalty.
# specific_signals: Symptoms that are highly suggestive of this condition.

myocarditis:
  commonness: very_rare
  required_features:
    - chest pain
    - shortness of breath
    - dyspnea
    - palpitations
  specific_signals:
    - viral prodrome
    - worse when lying down
    - myalgia

dehydration:
  commonness: common
  required_features: [] # No single required feature
  specific_signals:
    - thirst
    - thirsty
    - dry mouth
    - reduced intake
    - dark urine

urti: # Upper Respiratory Tract Infection
  commonness: common
  required_features: []
  specific_signals:
    - sore throat
    - nasal congestion
    - runny nose
    - cough

influenza_like_illness:
  commonness: common
  required_features:
    - fever
  specific_signals:
    - cough
    - myalgia
    - body aches
    - headache

diabetes_hyperglycemia:
  commonness: uncommon
  required_features:
    - thirst
    - polyuria
    - frequent urination
  specific_signals:
    - fatigue
    - blurred vision
    - unexplained weight loss

anemia:
  commonness: common
  required_features: []
  specific_signals:
    - fatigue
    - weakness
    - pale skin
    - shortness of breath
    - dizziness

pulmonary_embolism:
  commonness: rare
  required_features:
    - shortness of breath
    - chest pain
  specific_signals:
    - cough
    - leg swelling
    - pain in one leg

pneumonia:
  commonness: uncommon
  required_features:
    - cough
    - fever
  specific_signals:
    - shortness of breath
    - chest pain
    - fatigue

myasthenia_gravis:
  commonness: very_rare
  required_features:
    - muscle weakness
    - fatigability
    - ptosis
    - drooping eyelid
    - diplopia
    - double vision
  specific_signals:
    - ptosis
    - diplopia
    - difficulty swallowing
    - difficulty speaking
    - weakness worsens with activity

myasthenia-gravis:
  commonness: very_rare
  required_features:
    - muscle weakness
    - fatigability
    - ptosis
    - drooping eyelid
    - diplopia
    - double vision
  specific_signals:
    - ptosis
    - diplopia
    - difficulty swallowing
    - difficulty speaking
    - weakness worsens with activity
