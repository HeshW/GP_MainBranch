name: CI

on:
  push:
    branches: [ master, 'publish/*' ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:
    inputs:
      run_integration:
        description: 'Set to "true" to run OCR integration job'
        required: false
        default: 'false'

jobs:
  test:
    name: Run unit tests
    runs-on: ubuntu-latest
    # single Python version to keep linter-friendly (avoid in-file expressions)
    # matrix removed to prevent editor linters from flagging GitHub expressions
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          # use a simple static key to avoid editor expression parsing issues
          key: pip-cache
          restore-keys: |
            pip-cache

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements-test.txt ]; then pip install -r requirements-test.txt; fi

      - name: Run pytest
        run: |
          pytest -q

  # Integration tests are provided in a separate workflow `integration.yml`.
  # This keeps the unit-test workflow simple and avoids editor linters
  # flagging GitHub expression syntax in job-level `if` conditions.
