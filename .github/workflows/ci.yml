name: CI

on:
  push:
    branches: [ master, 'publish/**' ]
  pull_request:
    branches: [ master ]
  workflow_dispatch: {}

jobs:
  test:
    name: Run unit tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [3.11]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements-test.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements-test.txt ]; then pip install -r requirements-test.txt; fi

      - name: Run pytest
        run: |
          pytest -q

  # Optional integration job that runs only when explicitly requested by setting
  # the repository/runner environment variable RUN_OCR_INTEGRATION=1 or by using
  # workflow_dispatch inputs. This keeps integration tests opt-in to avoid
  # long-running OCR jobs on every push.
  integration:
    name: OCR Integration (optional)
    runs-on: ubuntu-latest
    if: ${{ github.event.inputs.run_integration == 'true' || env.RUN_OCR_INTEGRATION == '1' }}
    needs: test
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: 3.11

      - name: Install runtime deps
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements-runtime.txt ]; then pip install -r requirements-runtime.txt; fi

      - name: Run smoke tests (guarded)
        run: |
          # Example: run the smoke harness; set RUN_OCR_INTEGRATION input to true
          pytest tests/test_ocr.py -q
