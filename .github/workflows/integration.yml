name: OCR Integration (manual)

on:
  workflow_dispatch:
    inputs:
      run_integration:
        description: 'Trigger integration smoke tests' 
        required: false
        default: 'true'

jobs:
  integration:
    name: Run OCR integration smoke tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: 3.11

      - name: Install runtime deps
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements-runtime.txt ]; then pip install -r requirements-runtime.txt; fi

      - name: Run OCR smoke tests
        run: |
          # Manually triggered integration job; keep guarded and lightweight.
          pytest tests/test_ocr.py -q
